# Planted defects this diff.patch contains. Used by the eval harness (Phase 8) to
# compute recall/precision; for Phase 5 this documents what a correct review of
# fixtures/synthetic_prs/py_cmd_injection/diff.patch must catch.
findings:
  - rule_id: CWE-78
    file: app/backup.py
    line_start: 11
    line_end: 12
    severity: critical
    description: >
      create_backup builds a shell command by string-concatenating the
      caller-supplied repo_dir (and name, via the archive path) into a command
      string and runs it with subprocess.run(..., shell=True). Because the
      string is interpreted by the shell, a repo_dir such as
      "/tmp; rm -rf / #" injects and executes arbitrary OS commands. The fix is
      to pass an argument list (e.g. ["tar", "-czf", archive, repo_dir]) and
      drop shell=True so no shell parsing occurs.
