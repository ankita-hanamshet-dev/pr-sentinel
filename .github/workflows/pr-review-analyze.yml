# PR Review Analyze — the untrusted-safe half of the split analyse/publish pattern.
#
# This side does NO inference: it fetches the PR diff and runs HEURISTIC triage only
# (pr-sentinel extract). No model call, no LLM secret, no write permissions — so it
# is safe on fork-triggered runs, which GitHub withholds secrets from. Files the
# heuristic cannot classify are marked risk="unknown"; the trusted publish side (which
# has the secret) escalates ONLY those to the LLM triage agent.
#
# It checks out the trusted BASE ref, never the PR head, and reads the PR diff via the
# API as untrusted DATA. The single artifact carries context.json + pr-meta.json.
name: PR Review Analyze

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: sentinel-analyze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout BASE ref (trusted tool code, NEVER the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Heuristic triage -> context.json (no model call, no secret)
        run: |
          uv run pr-sentinel extract \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out context.json
      - name: Derive pr-meta.json (pr_number + head_sha) for the publish side
        run: |
          uv run python - <<'PY'
          import json
          d = json.load(open("context.json"))
          json.dump({"pr_number": d["pr_number"], "head_sha": d["head_sha"]}, open("pr-meta.json", "w"))
          PY
      - name: Step summary
        if: always()
        run: |
          {
            echo "## PR Sentinel — analyze (heuristic triage)"
            if [ -f context.json ]; then
              uv run python - <<'PY'
          import json
          d = json.load(open("context.json"))
          files = d["triage"]
          unknown = sum(1 for f in files if f["risk"] == "unknown")
          print(f"{len(files)} files triaged, {unknown} unknown (escalated on publish), "
                f"{len(d['hunks'])} hunks. Inference runs on the publish side.")
          PY
            else
              echo "no context produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-context
          path: |
            context.json
            pr-meta.json
          retention-days: 14
          if-no-files-found: error
