# Nightly Repo Report — 7-day rolling health report. The REASONING step (generate
# repo-health.json) and the WRITING step (upsert a single issue) are kept explicitly
# apart. NOTE: `pr-sentinel report` is implemented in Phase 8; until then the
# generation step falls back to a placeholder so the scheduled job never crashes.
name: Nightly Repo Report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Reasoning step — generate repo-health.json
        run: |
          uv run pr-sentinel report > repo-health.json 2>/dev/null || \
            echo '{"note": "repo-health generation is implemented in Phase 8"}' > repo-health.json
          cat repo-health.json
      - name: Upload repo-health.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health
          path: repo-health.json
          retention-days: 14
      - name: Writing step — upsert the single Weekly Code Health Report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-sentinel:weekly-report -->';
            const health = fs.readFileSync('repo-health.json', 'utf8');
            const title = 'Weekly Code Health Report';
            const body = `${marker}\n\n# ${title}\n\n\`\`\`json\n${health}\n\`\`\`\n\n_Generated ${new Date().toISOString()}_`;
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const match = existing.find((i) => (i.body || '').includes(marker));
            if (match) {
              await github.rest.issues.update({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
