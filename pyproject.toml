[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Multi-agent AI code reviewer that runs inside GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "structlog>=24",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
    "langgraph>=0.2",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_sentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E722 (no bare except) is mandatory per CLAUDE.md; kept on via the E group and pinned below.
select = ["E", "F", "I", "B", "UP", "W"]
extend-select = ["E722"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Third-party deps without usable stubs. follow_imports=skip stops mypy from
# parsing their sources (e.g. tiktoken statically imports numpy, whose stub uses
# 3.12-only syntax and breaks a 3.11 target).
module = [
    "rank_bm25",
    "rank_bm25.*",
    "tiktoken",
    "tiktoken.*",
    "langgraph",
    "langgraph.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
# Editable install: match measured files to the real src paths.
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
