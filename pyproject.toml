[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Multi-agent AI code reviewer that runs inside GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "structlog>=24",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
    "langgraph>=0.2",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=2.3.0",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_sentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E722 (no bare except) is mandatory per CLAUDE.md; kept on via the E group and pinned below.
select = ["E", "F", "I", "B", "UP", "W"]
extend-select = ["E722"]

[tool.mypy]
# NOTE: python_version here governs mypy's own stub-parsing capability, not the
# project's runtime target (requires-python stays >=3.11 everywhere else, including
# ruff's target-version). numpy>=2.3's bundled __init__.pyi (a transitive dep via
# rank-bm25) uses PEP 695 `type X = ...` syntax, which mypy only parses when
# python_version >= 3.12 -- with 3.11 set, mypy fails with a hard parse error before
# any per-module override (ignore_missing_imports/follow_imports/ignore_errors) can
# even apply, since packages that ship their own py.typed marker (numpy, rapidfuzz)
# are always fully parsed regardless of follow_imports=skip.
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# rank_bm25/tiktoken/langgraph ship no usable stubs at all; ignore_missing_imports
# covers them. numpy/rapidfuzz ship real (py.typed) stubs so follow_imports=skip is
# a no-op for them in practice, but is kept for documentation/intent.
module = [
    "rank_bm25",
    "rank_bm25.*",
    "tiktoken",
    "tiktoken.*",
    "langgraph",
    "langgraph.*",
    "numpy",
    "numpy.*",
    "rapidfuzz",
    "rapidfuzz.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
# Editable install: match measured files to the real src paths.
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E722", "B006"]
